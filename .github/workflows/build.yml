name: build

# main への push と PR ではビルドだけ確認し、v1.2.3 形式のタグを push したら Release を作って exe を置く。
# 手動実行（workflow_dispatch）では Release を作らず、リリース用の成果物の受け渡しまでを確認する
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# 既定は読み取りのみ。書き込みが必要なのはリリース用の job だけ
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # タグ名は v1.2.3 の形式だけを受け付ける（タグ名をそのままスクリプトに埋め込まないための検証）
      - name: Determine version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = '0.0.0'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "タグ名は v1.2.3 の形式にしてください: $env:REF_NAME" }
            $v = $Matches[1]
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.ps1 -Version $env:VERSION

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "VolumeKeeper-$env:VERSION"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item bin/VolumeKeeper.exe, README.md, LICENSE "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item bin/VolumeKeeper.exe dist/VolumeKeeper.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VolumeKeeper
          path: |
            dist/*.zip
            dist/VolumeKeeper.exe

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VolumeKeeper
          path: dist

      - name: List files
        run: ls -l dist

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" "dist/VolumeKeeper-$VERSION.zip" dist/VolumeKeeper.exe \
            --title "VolumeKeeper $TAG" --generate-notes
